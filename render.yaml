services:
  - type: web
    name: confidence-trivia-test
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile.server
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_PUBLISHABLE_KEY
        sync: false
